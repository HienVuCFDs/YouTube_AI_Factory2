<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900">
  <defs>
    <style>
      .bg{fill:#0c1016}.panel{fill:#141922;stroke:#2a3340;stroke-width:1}.panel2{fill:#10151d;stroke:#2a3340;stroke-width:1}.track{fill:#080b10;stroke:#2a3340;stroke-width:1}.muted{fill:#8f9baa}.text{fill:#eef2f6}.soft{fill:#cbd5df}.accent{fill:#f59e0b}.cyan{fill:#22d3ee}.green{fill:#34d399}.red{fill:#fb7185}.blue{fill:#60a5fa}.violet{fill:#a78bfa}.btn{fill:#f59e0b}.btn2{fill:#202938;stroke:#384354}.line{stroke:#2a3340;stroke-width:1}.h1{font:700 28px Arial, sans-serif}.h2{font:700 18px Arial, sans-serif}.h3{font:700 14px Arial, sans-serif}.body{font:400 13px Arial, sans-serif}.small{font:400 11px Arial, sans-serif}.tiny{font:700 10px Arial, sans-serif;text-transform:uppercase;letter-spacing:.08em}.mono{font:400 12px Consolas, monospace}
    </style>
  </defs>
  <rect class="bg" width="1440" height="900"/>
  <rect x="28" y="28" width="1384" height="844" rx="8" class="panel"/>
  <text x="62" y="70" class="tiny accent">Storyboard timeline preview</text>
  <text x="62" y="106" class="h1 text">Thanh timeline nằm trên Storyboard để xem nháp trước khi render final</text>
  <text x="62" y="132" class="body muted">Dùng asset hiện có: ảnh, clip, voice, subtitle text. Thiếu gì thì đánh dấu ngay trên timeline.</text>

  <rect x="62" y="162" width="1316" height="190" rx="8" class="panel2"/>
  <text x="88" y="198" class="h2 text">Preview storyboard</text>
  <rect x="88" y="220" width="82" height="42" rx="7" class="btn"/>
  <text x="116" y="246" class="h3 bg">Play</text>
  <rect x="184" y="220" width="82" height="42" rx="7" class="btn2"/>
  <text x="211" y="246" class="h3 soft">Stop</text>
  <rect x="280" y="220" width="150" height="42" rx="7" class="btn2"/>
  <text x="303" y="246" class="h3 soft">Preview cảnh</text>
  <rect x="444" y="220" width="166" height="42" rx="7" class="btn2"/>
  <text x="467" y="246" class="h3 soft">Render bản nháp</text>
  <text x="646" y="236" class="mono muted">00:18 / 01:12</text>
  <text x="646" y="258" class="small muted">Click một block để nhảy tới card cảnh bên dưới.</text>

  <rect x="88" y="290" width="1238" height="38" rx="7" class="track"/>
  <rect x="92" y="294" width="126" height="30" rx="5" fill="#2563eb"/>
  <rect x="222" y="294" width="154" height="30" rx="5" fill="#7c3aed"/>
  <rect x="380" y="294" width="114" height="30" rx="5" fill="#be123c"/>
  <rect x="498" y="294" width="138" height="30" rx="5" fill="#059669"/>
  <rect x="640" y="294" width="168" height="30" rx="5" fill="#92400e"/>
  <rect x="812" y="294" width="120" height="30" rx="5" fill="#2563eb"/>
  <rect x="936" y="294" width="154" height="30" rx="5" fill="#334155"/>
  <rect x="1094" y="294" width="228" height="30" rx="5" fill="#334155"/>
  <line x1="388" y1="286" x2="388" y2="332" stroke="#f59e0b" stroke-width="3"/>
  <text x="112" y="314" class="small text">1 ready</text>
  <text x="252" y="314" class="small text">2 video</text>
  <text x="404" y="314" class="small text">3 thiếu hình</text>
  <text x="526" y="314" class="small text">4 voice</text>
  <text x="668" y="314" class="small text">5 fallback</text>
  <text x="840" y="314" class="small text">6 ready</text>
  <text x="966" y="314" class="small text">7 pending</text>
  <text x="1136" y="314" class="small text">8 chưa làm</text>

  <rect x="62" y="378" width="880" height="442" rx="8" class="panel2"/>
  <text x="88" y="414" class="h2 text">Cảnh đang chọn: Cảnh 3</text>
  <rect x="88" y="440" width="396" height="222" rx="8" fill="#24141a" stroke="#69303d"/>
  <text x="214" y="556" class="h3 red">Thiếu visual</text>
  <text x="512" y="462" class="tiny red">Cần xử lý trước khi render</text>
  <text x="512" y="494" class="h3 text">Lời đọc</text>
  <text x="512" y="524" class="body soft">Quy tắc 3-2-1 giúp bạn không phụ thuộc vào một ổ cứng duy nhất.</text>
  <text x="512" y="568" class="h3 text">Visual prompt</text>
  <text x="512" y="598" class="body muted">Biểu đồ 3 bản sao, 2 thiết bị, 1 bản ngoài máy. Nền tối, chữ rõ.</text>
  <rect x="512" y="636" width="128" height="38" rx="7" class="btn"/>
  <text x="538" y="660" class="h3 bg">Tạo visual</text>
  <rect x="654" y="636" width="120" height="38" rx="7" class="btn2"/>
  <text x="679" y="660" class="h3 soft">Gắn file</text>
  <rect x="788" y="636" width="108" height="38" rx="7" class="btn2"/>
  <text x="817" y="660" class="h3 soft">Sửa</text>
  <rect x="88" y="700" width="808" height="78" rx="8" fill="#0c1016" stroke="#2a3340"/>
  <text x="112" y="730" class="h3 text">Audio waveform</text>
  <rect x="112" y="746" width="730" height="8" rx="4" fill="#1f2937"/>
  <rect x="112" y="746" width="312" height="8" rx="4" fill="#22d3ee"/>

  <rect x="970" y="378" width="356" height="442" rx="8" class="panel2"/>
  <text x="998" y="414" class="h2 text">Preflight live</text>
  <text x="998" y="454" class="body green">5 cảnh có đủ visual + voice</text>
  <text x="998" y="488" class="body red">2 cảnh thiếu visual</text>
  <text x="998" y="522" class="body red">1 cảnh thiếu voice</text>
  <text x="998" y="556" class="body accent">1 job đang chạy</text>
  <rect x="998" y="594" width="272" height="42" rx="7" class="btn"/>
  <text x="1043" y="620" class="h3 bg">Tạo phần còn thiếu</text>
  <rect x="998" y="652" width="272" height="42" rx="7" class="btn2"/>
  <text x="1048" y="678" class="h3 soft">Dùng fallback nháp</text>
  <rect x="998" y="710" width="272" height="42" rx="7" class="btn2"/>
  <text x="1062" y="736" class="h3 soft">Mở job/log</text>
</svg>
