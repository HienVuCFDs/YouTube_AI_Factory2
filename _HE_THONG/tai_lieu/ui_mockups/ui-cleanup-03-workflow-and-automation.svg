<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900">
  <defs>
    <style>
      .bg{fill:#0c1016}.panel{fill:#141922;stroke:#2a3340;stroke-width:1}.panel2{fill:#10151d;stroke:#2a3340;stroke-width:1}.muted{fill:#8f9baa}.text{fill:#eef2f6}.soft{fill:#cbd5df}.accent{fill:#f59e0b}.cyan{fill:#22d3ee}.green{fill:#34d399}.red{fill:#fb7185}.btn{fill:#f59e0b}.btn2{fill:#202938;stroke:#384354}.line{stroke:#2a3340;stroke-width:1}.h1{font:700 28px Arial, sans-serif}.h2{font:700 18px Arial, sans-serif}.h3{font:700 14px Arial, sans-serif}.body{font:400 13px Arial, sans-serif}.small{font:400 11px Arial, sans-serif}.tiny{font:700 10px Arial, sans-serif;text-transform:uppercase;letter-spacing:.08em}.mono{font:400 12px Consolas, monospace}
    </style>
  </defs>
  <rect class="bg" width="1440" height="900"/>
  <text x="54" y="66" class="tiny accent">Manual-first, automation-ready</text>
  <text x="54" y="104" class="h1 text">Nhiều workflow, một xưởng thao tác chung</text>
  <text x="54" y="132" class="body muted">Mỗi workflow chỉ đổi đầu vào và chiến lược visual. Các bước sản xuất, job, approval và API dùng chung.</text>
  <rect x="54" y="174" width="414" height="606" rx="8" class="panel"/>
  <text x="84" y="216" class="h2 text">Workflow</text>
  <g transform="translate(84 250)">
    <rect x="0" y="0" width="354" height="92" rx="8" class="panel2"/>
    <text x="20" y="30" class="h3 text">WF Content</text>
    <text x="20" y="56" class="small muted">Topic/script → AI image/video → render</text>
    <text x="260" y="30" class="small green">Sẵn sàng</text>
    <rect x="0" y="112" width="354" height="92" rx="8" class="panel2"/>
    <text x="20" y="142" class="h3 text">WF Reup</text>
    <text x="20" y="168" class="small muted">Video nguồn → lời bình mới → cắt source clip</text>
    <text x="262" y="142" class="small accent">Beta</text>
    <rect x="0" y="224" width="354" height="92" rx="8" class="panel2"/>
    <text x="20" y="254" class="h3 text">Ảnh to Video</text>
    <text x="20" y="280" class="small muted">Upload ảnh → motion/video → voice/render</text>
    <text x="242" y="254" class="small muted">Sắp thêm</text>
    <rect x="0" y="336" width="354" height="92" rx="8" class="panel2"/>
    <text x="20" y="366" class="h3 text">Báo to Video</text>
    <text x="20" y="392" class="small muted">URL bài viết → extract → script → storyboard</text>
    <text x="242" y="366" class="small muted">Sắp thêm</text>
  </g>
  <rect x="510" y="174" width="414" height="606" rx="8" class="panel"/>
  <text x="540" y="216" class="h2 text">Xưởng chung</text>
  <g transform="translate(540 258)">
    <rect x="0" y="0" width="354" height="54" rx="8" class="panel2"/><text x="20" y="34" class="h3 text">1. Nguồn</text><text x="260" y="34" class="small green">manual</text>
    <rect x="0" y="70" width="354" height="54" rx="8" class="panel2"/><text x="20" y="104" class="h3 text">2. Phân tích</text><text x="260" y="104" class="small green">manual</text>
    <rect x="0" y="140" width="354" height="54" rx="8" class="panel2"/><text x="20" y="174" class="h3 text">3. Kịch bản</text><text x="250" y="174" class="small accent">approval</text>
    <rect x="0" y="210" width="354" height="54" rx="8" class="panel2"/><text x="20" y="244" class="h3 text">4. Voice</text><text x="260" y="244" class="small green">job</text>
    <rect x="0" y="280" width="354" height="54" rx="8" class="panel2"/><text x="20" y="314" class="h3 text">5. Storyboard</text><text x="260" y="314" class="small green">job</text>
    <rect x="0" y="350" width="354" height="54" rx="8" class="panel2"/><text x="20" y="384" class="h3 text">6. Render</text><text x="250" y="384" class="small accent">preflight</text>
    <rect x="0" y="420" width="354" height="54" rx="8" class="panel2"/><text x="20" y="454" class="h3 text">7. Xuất bản</text><text x="236" y="454" class="small red">duyệt cuối</text>
  </g>
  <rect x="966" y="174" width="414" height="606" rx="8" class="panel"/>
  <text x="996" y="216" class="h2 text">Automation sau này</text>
  <rect x="996" y="250" width="354" height="98" rx="8" class="panel2"/>
  <text x="1018" y="282" class="h3 text">Inbox lệnh</text>
  <text x="1018" y="312" class="body muted">Telegram, ChatGPT app, Claude app</text>
  <text x="1018" y="334" class="mono muted">message_id chống chạy trùng</text>
  <line x1="1173" y1="360" x2="1173" y2="406" class="line"/>
  <rect x="996" y="414" width="354" height="98" rx="8" class="panel2"/>
  <text x="1018" y="446" class="h3 text">Intent parser</text>
  <text x="1018" y="476" class="body muted">Tạo project, chọn workflow, sinh job</text>
  <text x="1018" y="498" class="mono muted">không render/đăng thẳng</text>
  <line x1="1173" y1="524" x2="1173" y2="570" class="line"/>
  <rect x="996" y="578" width="354" height="98" rx="8" class="panel2"/>
  <text x="1018" y="610" class="h3 text">Approval gate</text>
  <text x="1018" y="640" class="body muted">Tốn tiền, tải nguồn, publish đều cần duyệt</text>
  <text x="1018" y="662" class="mono muted">same API as manual UI</text>
  <rect x="996" y="710" width="354" height="42" rx="7" class="btn"/>
  <text x="1076" y="736" class="h3 bg">Mở project để duyệt</text>
</svg>
